# Phase 1: HTTP only. Serves the certbot challenge and proxies the app.
# Save as <proxy folder>/conf/app.example.com.conf, then:
#   docker exec nginx nginx -t && docker exec nginx nginx -s reload
# Replace: app.example.com, my-app:3000, and /var/www/certbot (the webroot path INSIDE the nginx
# container; read it from the inventory's mounts).

server {
    listen 80;
    server_name app.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Resolve the container per request: nginx starts even if the app is down.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://my-app:3000;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        client_max_body_size 20m;
    }
}
