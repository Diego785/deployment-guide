# Phase 2: HTTPS. Use only once the certificate exists:
#   <certificates folder>/live/app.example.com/fullchain.pem and privkey.pem
# Replace the phase 1 file with this one, then:
#   docker exec nginx nginx -t && docker exec nginx nginx -s reload
# Replace: app.example.com, my-app:3000, /var/www/certbot and /etc/letsencrypt (paths INSIDE the
# nginx container; read them from the inventory's mounts and from the other .conf files).

server {
    listen 80;
    server_name app.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # nginx >= 1.25. On older versions remove this line and write "listen 443 ssl http2;".
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    client_max_body_size 20m;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://my-app:3000;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSockets and streaming. $http_upgrade is empty on normal requests, which makes this
        # equivalent to a keep-alive connection; no "map" block needed.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
    }
}
