# Default site: answers requests for any name no other .conf claims (the bare IP, old domains,
# scanners) by closing the connection, instead of showing whichever site nginx loads first.
# Save as <proxy folder>/conf/00-default.conf (docs/17-shared-proxy-from-scratch.md), then:
#   docker exec nginx nginx -t && docker exec nginx nginx -s reload

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Lets you test the challenge folder before any site exists (docs/07, "Requirements").
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;    # nginx-only code: close the connection without answering
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Refuses the TLS handshake for unknown names; needs no certificate (nginx >= 1.19.4).
    ssl_reject_handshake on;
}
